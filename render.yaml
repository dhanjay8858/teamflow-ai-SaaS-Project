# =============================================================================
# TeamFlow AI — Render Deployment Configuration
# https://render.com/docs/render-yaml-spec
# =============================================================================
# Usage:
#   1. Connect your GitHub repository to Render
#   2. Render auto-detects this render.yaml and creates all services
#   3. Set secret environment variables manually in the Render dashboard
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────
  # TeamFlow AI — Backend API Server
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: teamflow-ai-server
    runtime: node
    region: oregon              # Choose: oregon | frankfurt | singapore | ohio
    plan: free                  # free | starter | standard | pro

    # Build & Start
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js

    # Health Check — Render uses this to determine if the service is up
    healthCheckPath: /health

    # Auto-deploy on push to main branch
    autoDeploy: true

    # Environment Variables
    # NOTE: Variables marked "sync: false" must be set manually in Render Dashboard
    # Go to: Dashboard → teamflow-ai-server → Environment → Add Environment Variable
    envVars:
      # ── Core Configuration ────────────────────────────────────
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000             # Render assigns port 10000 by default

      - key: APP_VERSION
        value: 1.2.0

      # ── Client URL (your Vercel frontend domain) ─────────────
      # IMPORTANT: Update this to your actual Vercel URL after deploying frontend
      - key: CLIENT_URL
        value: https://YOUR_VERCEL_APP.vercel.app

      # ── MongoDB Atlas (required) ──────────────────────────────
      - key: MONGODB_URI
        sync: false             # Set in Render dashboard — contains credentials

      # ── Authentication Secrets (required) ────────────────────
      - key: JWT_ACCESS_SECRET
        sync: false             # Generate: openssl rand -hex 32

      - key: JWT_REFRESH_SECRET
        sync: false             # Generate: openssl rand -hex 32

      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # ── Cloudinary (required for file uploads) ────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Redis (optional — for horizontal scaling) ────────────
      # Leave REDIS_ENABLED=false for single-instance deployment
      # Set to true if using Upstash Redis (see docs/deployment/redis-upstash-setup.md)
      - key: REDIS_ENABLED
        value: "false"

      - key: REDIS_URL
        value: ""               # e.g., rediss://default:PASSWORD@HOST:6380

      # ── Observability ─────────────────────────────────────────
      - key: LOG_LEVEL
        value: info

      - key: METRICS_ENABLED
        value: "true"

      - key: ENABLE_REDIS_EVENTS
        value: "false"

      # ── AI Providers (required for AI features) ───────────────
      - key: GROQ_API_KEY
        sync: false             # Get from: https://console.groq.com

      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      - key: GEMINI_API_KEY
        sync: false             # Get from: https://ai.google.dev

      - key: GEMINI_MODEL
        value: gemini-1.5-flash

      # Ollama is local-dev only — disabled in production
      - key: OLLAMA_URL
        value: ""

      # ── AI Provider Defaults ──────────────────────────────────
      - key: LLM_PROVIDER
        value: groq

      - key: EMBEDDING_PROVIDER
        value: nomic

      - key: VECTOR_STORE
        value: mongodb

      # ── LLM Hyperparameters ───────────────────────────────────
      - key: LLM_TIMEOUT_MS
        value: "15000"

      - key: MAX_RETRIES
        value: "2"

      - key: MAX_CONTEXT_TOKENS
        value: "128000"

      - key: MAX_OUTPUT_TOKENS
        value: "4096"

      - key: TEMPERATURE
        value: "0.7"

      - key: TOP_P
        value: "0.95"
