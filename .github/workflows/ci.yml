name: TeamFlow AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint & Type Check
  # ─────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Server Node Modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-server-node-${{ hashFiles('server/package-lock.json') }}

      - name: Cache Client Node Modules
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: ${{ runner.os }}-client-node-${{ hashFiles('client/package-lock.json') }}

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: TypeScript Check — Server
        working-directory: server
        run: npx tsc --noEmit

      - name: TypeScript Check — Client
        working-directory: client
        run: npx tsc --noEmit

      - name: ESLint — Client
        working-directory: client
        run: npm run lint

  # ─────────────────────────────────────────
  # JOB 2: Backend Unit & Integration Tests
  # ─────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Vitest + Supertest)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Server Node Modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-server-node-${{ hashFiles('server/package-lock.json') }}

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

      - name: Run Backend Tests with Coverage
        working-directory: server
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'ci-test-access-secret-1234-min32chars' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-test-refresh-secret-5678-min32chars' }}
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          CLIENT_URL: http://localhost:3000

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: server/coverage/
          retention-days: 14

  # ─────────────────────────────────────────
  # JOB 3: Frontend Unit Tests
  # ─────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests (Vitest + RTL)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Client Node Modules
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: ${{ runner.os }}-client-node-${{ hashFiles('client/package-lock.json') }}

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Run Frontend Tests with Coverage
        working-directory: client
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: client/coverage/
          retention-days: 14

  # ─────────────────────────────────────────
  # JOB 4: Playwright E2E Tests
  # ─────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: |
          cd server && npm ci
          cd ../client && npm ci

      - name: Install Playwright Browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Start Backend Server
        working-directory: server
        run: npm run dev &
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-test-access-secret-1234-min32chars
          JWT_REFRESH_SECRET: ci-test-refresh-secret-5678-min32chars
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://localhost:27017/teamflow-ci' }}
          PORT: 5000
          CLIENT_URL: http://localhost:3000

      - name: Start Frontend Dev Server
        working-directory: client
        run: npm run dev &

      - name: Wait for Servers
        run: |
          npx wait-on http://localhost:5000/health http://localhost:3000 --timeout 60000

      - name: Run Playwright Tests
        working-directory: client
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────
  # JOB 5: Production Build Verification
  # ─────────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Server (TypeScript → dist/)
        working-directory: server
        run: |
          npm ci
          npm run build
        env:
          NODE_ENV: production

      - name: Build Client (Vite → dist/)
        working-directory: client
        run: |
          npm ci
          npm run build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: /api/v1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            server/dist/
            client/dist/
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 6: Docker Image Build Verification
  # ─────────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: teamflow-ai-server:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: teamflow-ai-client:test

  # ─────────────────────────────────────────
  # JOB 7: Security Vulnerability Audit
  # ─────────────────────────────────────────
  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit Server Dependencies
        working-directory: server
        run: npm audit --audit-level=high || true

      - name: Audit Client Dependencies
        working-directory: client
        run: npm audit --audit-level=high || true

